<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>出口成章 · 妙笔生花</title>
  <style>
    /* ===== 基础重置 ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; background: #0a0a14; color: #f0ead6; overflow-x: hidden; }

    /* ===== 背景粒子效果 ===== */
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    /* ===== 主容器 ===== */
    .app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    /* ===== 顶部标题栏 ===== */
    .header {
      text-align: center;
      padding: 28px 20px 20px;
      background: linear-gradient(180deg, rgba(10,10,20,0.9) 0%, transparent 100%);
    }
    .header-logo {
      font-size: 13px;
      letter-spacing: 4px;
      color: #c9a84c;
      text-transform: uppercase;
      margin-bottom: 6px;
      opacity: 0.8;
    }
    .header-title {
      font-size: 30px;
      font-weight: 700;
      background: linear-gradient(135deg, #f5d98b, #c9a84c, #f5d98b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
    }
    .header-subtitle {
      font-size: 12px;
      color: rgba(240,234,214,0.45);
      margin-top: 5px;
      letter-spacing: 2px;
    }

    /* ===== 主内容区 ===== */
    .main { flex: 1; padding: 10px 16px 100px; max-width: 480px; margin: 0 auto; width: 100%; }

    /* ===== 卡片基础样式 ===== */
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .card-title {
      font-size: 12px;
      color: #c9a84c;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title::before {
      content: '';
      display: inline-block;
      width: 3px; height: 14px;
      background: linear-gradient(180deg, #f5d98b, #c9a84c);
      border-radius: 2px;
    }

    /* ===== 上传区域 ===== */
    .upload-zone {
      border: 1.5px dashed rgba(201,168,76,0.35);
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      background: rgba(201,168,76,0.03);
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: #c9a84c;
      background: rgba(201,168,76,0.07);
      transform: scale(1.01);
    }
    .upload-zone input[type="file"] {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }
    .upload-icon { font-size: 40px; margin-bottom: 10px; }
    .upload-hint { font-size: 14px; color: rgba(240,234,214,0.6); line-height: 1.6; }
    .upload-hint span { color: #c9a84c; }

    /* ===== 预览区 ===== */
    .preview-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      margin-bottom: 14px;
    }
    .preview-wrap img, .preview-wrap video {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      display: block;
    }
    .preview-remove {
      position: absolute; top: 8px; right: 8px;
      width: 28px; height: 28px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; cursor: pointer; color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      transition: background 0.2s;
    }
    .preview-remove:hover { background: rgba(200,50,50,0.7); }

    /* ===== 风格选择 ===== */
    .style-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .style-btn {
      padding: 10px 6px;
      border-radius: 12px;
      border: 1px solid rgba(201,168,76,0.2);
      background: rgba(255,255,255,0.03);
      color: rgba(240,234,214,0.7);
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      line-height: 1.4;
    }
    .style-btn .style-icon { font-size: 20px; display: block; margin-bottom: 3px; }
    .style-btn:hover { border-color: #c9a84c; color: #f5d98b; background: rgba(201,168,76,0.08); }
    .style-btn.active {
      border-color: #c9a84c;
      background: rgba(201,168,76,0.15);
      color: #f5d98b;
      box-shadow: 0 0 12px rgba(201,168,76,0.2);
    }

    /* ===== 补充描述 ===== */
    .desc-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 12px;
      padding: 12px 14px;
      color: #f0ead6;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      outline: none;
      transition: border-color 0.25s;
      font-family: inherit;
    }
    .desc-input::placeholder { color: rgba(240,234,214,0.3); }
    .desc-input:focus { border-color: #c9a84c; }

    /* ===== 生成按钮 ===== */
    .btn-generate {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, #c9a84c, #f5d98b, #c9a84c);
      background-size: 200% 200%;
      color: #1a1208;

    }
    .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(201,168,76,0.45); }
    .btn-generate:active { transform: translateY(0); }
    .btn-generate.loading { pointer-events: none; opacity: 0.8; }
    .btn-generate .btn-text { position: relative; z-index: 1; }

    /* ===== 加载动画 ===== */
    .loading-overlay {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10,10,20,0.85);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .loading-overlay.show { display: flex; }
    .loading-brush {
      font-size: 50px;
      animation: brushSpin 1.5s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes brushSpin {
      0%, 100% { transform: rotate(-15deg) scale(1); }
      50% { transform: rotate(15deg) scale(1.1); }
    }
    .loading-text {
      font-size: 15px;
      color: #c9a84c;
      letter-spacing: 3px;
    }
    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '·'; }
      60% { content: '··'; }
      80%, 100% { content: '···'; }
    }

    /* ===== 结果区 ===== */
    .result-section { display: none; }
    .result-section.show { display: block; }

    .result-card {
      background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(245,217,139,0.05));
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 20px;
      padding: 22px 20px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    .result-card::before {
      content: '"';

      font-size: 80px;
      color: rgba(201,168,76,0.08);

      line-height: 1;

      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #c9a84c;
      letter-spacing: 2px;
      background: rgba(201,168,76,0.12);
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 14px;

    .result-text {
      font-size: 16px;
      line-height: 2;
      color: #f0ead6;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
      white-space: pre-line;
    }
    .result-text.classical {
      font-size: 18px;
      text-align: center;
      line-height: 2.2;
      letter-spacing: 3px;
    }

    /* ===== 操作按钮组 ===== */
    .action-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .btn-copy, .btn-regen, .btn-more {
      padding: 13px;
      border-radius: 14px;
      border: 1px solid rgba(201,168,76,0.3);
      background: rgba(255,255,255,0.04);
      color: #f0ead6;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.25s;
      font-family: inherit;
    }
    .btn-copy:hover { background: rgba(201,168,76,0.15); border-color: #c9a84c; color: #f5d98b; }
    .btn-regen:hover { background: rgba(255,255,255,0.08); border-color: rgba(201,168,76,0.5); }
    .btn-more { grid-column: span 2; background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(245,217,139,0.08)); border-color: rgba(201,168,76,0.35); }
    .btn-more:hover { background: rgba(201,168,76,0.22); }

    /* ===== 复制成功提示 ===== */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(201,168,76,0.9);
      color: #1a1208;
      padding: 10px 22px;
      border-radius: 30px;

      font-weight: 600;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 200;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== 多组结果切换 ===== */
    .result-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .result-tabs::-webkit-scrollbar { display: none; }
    .result-tab {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(201,168,76,0.2);
      background: rgba(255,255,255,0.03);
      color: rgba(240,234,214,0.5);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .result-tab.active {
      background: rgba(201,168,76,0.15);
      border-color: #c9a84c;
      color: #f5d98b;
    }

    /* ===== 底部装饰 ===== */
    .footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: linear-gradient(0deg, rgba(10,10,20,0.95) 70%, transparent);
      padding: 12px 0 20px;
      text-align: center;
      font-size: 11px;
      color: rgba(240,234,214,0.2);
      letter-spacing: 2px;
      pointer-events: none;
    }

    /* ===== 图片叠加文字效果 ===== */
    .poem-overlay-wrap {
      position: relative;
      display: none;
    }
    .poem-overlay-wrap.show { display: block; }
    .poem-overlay-wrap img {
      width: 100%;
      border-radius: 14px;
      display: block;
    }
    .poem-overlay-text {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(0deg, rgba(10,10,20,0.85) 0%, transparent 100%);
      padding: 30px 20px 20px;
      border-radius: 0 0 14px 14px;
      font-size: 15px;
      line-height: 2;
      letter-spacing: 2px;
      color: #f5d98b;
      text-align: center;
      white-space: pre-line;
    }
    .share-hint {
      font-size: 11px;
      color: rgba(240,234,214,0.35);
      text-align: center;
      margin-top: 8px;

    }

    /* ===== 分割线 ===== */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.2), transparent);
      margin: 4px 0 16px;
    }

    /* ===== 响应动画 ===== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeInUp 0.5s ease forwards; }
  </style>
</head>
<body>

<!-- 主应用 -->

<script>
// ============================================================
// 背景粒子
// ============================================================
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function createParticles() {
    particles = [];
    const count = Math.floor(W * H / 15000);
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        vx: (Math.random() - 0.5) * 0.2,
        vy: (Math.random() - 0.5) * 0.2,
        alpha: Math.random() * 0.5 + 0.1
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(201,168,76,${p.alpha})`;
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    });
    requestAnimationFrame(draw);
  }

  resize(); createParticles(); draw();
  window.addEventListener('resize', () => { resize(); createParticles(); });
})();

// ============================================================
// 全局状态 & 内置配置
// ============================================================
let currentFile = null;
let currentFileURL = null;
let currentFileType = null;
let selectedStyle = 'classical';
let generatedResults = [];
let currentResultIdx = 0;

// 内置智谱 AI 配置（免费，无需用户配置）
const CONFIG = {
  apiKey: '9cf284dbcccd4999842628d7d9808ddf.jQlwnd15b6yzm61E',
  apiBase: 'https://open.bigmodel.cn/api/paas/v4',
  model: 'glm-4v-flash'
};

// ============================================================
// 文件上传处理
// ============================================================
const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');

fileInput.addEventListener('change', function() {
  if (this.files && this.files[0]) handleFile(this.files[0]);
});

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});

function handleFile(file) {
  currentFile = file;
  currentFileType = file.type.startsWith('video') ? 'video' : 'image';
  if (currentFileURL) URL.revokeObjectURL(currentFileURL);
  currentFileURL = URL.createObjectURL(file);

  const wrap = document.getElementById('previewWrap');
  const old = wrap.querySelector('img, video');
  if (old) old.remove();

  if (currentFileType === 'image') {
    const img = document.createElement('img');
    img.src = currentFileURL;
    wrap.appendChild(img);
  } else {
    const vid = document.createElement('video');
    vid.src = currentFileURL;
    vid.controls = true;
    vid.playsInline = true;
    wrap.appendChild(vid);
  }

  document.getElementById('previewSection').style.display = 'block';
  document.getElementById('uploadZone').style.display = 'none';
  document.getElementById('resultSection').classList.remove('show');
}

function removeFile() {
  currentFile = null;
  if (currentFileURL) { URL.revokeObjectURL(currentFileURL); currentFileURL = null; }
  document.getElementById('previewSection').style.display = 'none';
  document.getElementById('uploadZone').style.display = 'block';
  document.getElementById('resultSection').classList.remove('show');
  fileInput.value = '';
}

// ============================================================
// 风格选择
// ============================================================
function selectStyle(el) {
  document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedStyle = el.dataset.style;
}

// ============================================================
// AI 生成（核心提示词，深度关联图片内容）
// ============================================================
function buildSystemPrompt() {
  return `你是一位兼通古今、文采飞扬的文字大师，是朋友圈文案界的顶级高手。

你的核心能力：**仔细观察图片中的每一个细节**（景物、人物、光影、色彩、构图、氛围、情绪），从中提炼出最打动人的元素，然后写出令人叹为观止的诗词文案。

关键要求：
1. **必须基于图片实际内容创作**，不要写空洞的通用文案

async function generatePoem() {
  if (!currentFile) {
    showToast('⚠️ 请先上传一张图片');
    return;
  }

  const desc = document.getElementById('descInput').value.trim();
  showLoading(true);

  try {
    const results = await callAI(desc);
    generatedResults = results;
    currentResultIdx = 0;
    renderResults();
  } catch (err) {
    showToast('⚠️ 生成失败：' + (err.message || '请稍后重试'));
  } finally {
    showLoading(false);
  }
}

async function callAI(desc) {
  const styleInfo = styleMap[selectedStyle];
  let userText = styleInfo.prompt;
  if (desc) {
    userText += `\n\n用户补充信息：${desc}\n请将用户的补充信息与图片画面结合，在文案中自然融入这些信息。`;
  }

  // 智谱 GLM-4V-Flash 不支持 system 角色，合并为 user 消息
  const systemText = buildSystemPrompt();
  const fullUserText = systemText + '\n\n' + userText;

  // 构建用户消息（含图片）
  const userContent = [];
  userContent.push({ type: 'text', text: fullUserText });

  if (currentFile && currentFileType === 'image') {
    const base64 = await fileToCompressedBase64(currentFile);
    userContent.push({
      type: 'image_url',
      image_url: { url: base64 }
    });
  }

  const messages = [
    { role: 'user', content: userContent }
  ];

  const res = await fetch(`${CONFIG.apiBase}/chat/completions`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${CONFIG.apiKey}`
    },
    body: JSON.stringify({
      model: CONFIG.model,
      messages: messages,
      max_tokens: 1500,
      temperature: 0.9
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `请求失败 (${res.status})`);
  }

  const data = await res.json();
  const raw = data.choices?.[0]?.message?.content || '';
  return parseResults(raw);
}

function parseResults(raw) {
  // 尝试按 --- 或「版本」标记分割
  let parts = raw.split(/---+/).map(s => s.trim()).filter(Boolean);
  if (parts.length <= 1) {
    // 尝试按「版本X」分割
    parts = raw.split(/(?=版本[一二三三四五六七八九十])/).map(s => s.trim()).filter(Boolean);
  }
  if (parts.length <= 1) {
    // 整体作为一个结果
    parts = [raw.trim()];
  }
  return parts.map((text, i) => ({ idx: i + 1, text: text.replace(/^版本[一二三四五六七八九十]\s*[:：]?\s*/gm, '').trim(), style: selectedStyle }));
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 压缩图片为较小尺寸的base64，避免超出API token限制
function fileToCompressedBase64(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      // 限制最大边长为1024px
      const MAX = 1024;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

// ============================================================
// 渲染结果
// ============================================================
function renderResults() {
  const section = document.getElementById('resultSection');
  section.classList.add('show');
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });

  const tabs = document.getElementById('resultTabs');
  tabs.innerHTML = '';
  generatedResults.forEach((r, i) => {
    const tab = document.createElement('div');
    tab.className = 'result-tab' + (i === currentResultIdx ? ' active' : '');
    tab.textContent = `版本 ${i + 1}`;
    tab.onclick = () => switchResult(i);
    tabs.appendChild(tab);
  });

  showResult(currentResultIdx);
}

function showResult(idx) {
  const r = generatedResults[idx];
  if (!r) return;

  const card = document.getElementById('resultCard');
  const styleInfo = styleMap[r.style] || styleMap.classical;

  document.getElementById('resultStyleTag').textContent = styleInfo.label;
  const textEl = document.getElementById('resultText');
  textEl.className = 'result-text' + (r.style === 'classical' ? ' classical' : '');
  textEl.textContent = r.text;

  card.classList.remove('fade-in');
  void card.offsetWidth;
  card.classList.add('fade-in');

  // 图文叠加
  const overlayWrap = document.getElementById('overlayWrap');
  const shareHint = document.getElementById('shareHint');
  if (currentFile && currentFileType === 'image') {
    document.getElementById('overlayImg').src = currentFileURL;
    document.getElementById('overlayText').textContent = r.text;
    overlayWrap.classList.add('show');
    shareHint.style.display = 'block';
  } else {
    overlayWrap.classList.remove('show');
    shareHint.style.display = 'none';
  }
}

function switchResult(idx) {
  currentResultIdx = idx;
  document.querySelectorAll('.result-tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
  showResult(idx);
}

async function regenerate() {
  await generatePoem();
}

async function generateMore() {
  const styles = Object.keys(styleMap);
  const next = styles[(styles.indexOf(selectedStyle) + 1) % styles.length];
  selectedStyle = next;
  document.querySelectorAll('.style-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.style === next);
  });
  await generatePoem();
}

// ============================================================
// 复制
// ============================================================
function copyText() {
  const r = generatedResults[currentResultIdx];
  if (!r) return;
  const text = r.text;

  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('✓ 已复制，快去发朋友圈吧！'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✓ 已复制，快去发朋友圈吧！');
  }
}

// ============================================================
// 工具函数
// ============================================================
function showLoading(show) {
  document.getElementById('loadingOverlay').classList.toggle('show', show);
  document.getElementById('btnGenerate').classList.toggle('loading', show);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
